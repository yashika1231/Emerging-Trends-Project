# ══════════════════════════════════════════════════════════
# PhishGuard AI — Production Docker Compose
# ══════════════════════════════════════════════════════════
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

version: "3.8"

services:
  # ── API Backend ──────────────────────────────────────────
  phishing-detector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phishguard-api
    env_file:
      - .env.production
    environment:
      - CHROMA_PERSIST_DIR=/app/chroma_data
      - ENVIRONMENT=production
    volumes:
      - chroma_data:/app/chroma_data
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.5"
    networks:
      - phishguard-net
    # Don't expose port directly — Nginx handles it
    expose:
      - "8000"

  # ── Nginx Reverse Proxy ─────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: phishguard-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      # Uncomment for SSL:
      # - ./ssl/cert.pem:/etc/nginx/ssl/cert.pem:ro
      # - ./ssl/key.pem:/etc/nginx/ssl/key.pem:ro
    depends_on:
      phishing-detector:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - phishguard-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

networks:
  phishguard-net:
    driver: bridge

volumes:
  chroma_data:
    driver: local
