# ══════════════════════════════════════════════════════════
# PhishGuard AI — Nginx Reverse Proxy Configuration
# ══════════════════════════════════════════════════════════

upstream phishguard_api {
    server phishing-detector:8000;
}

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;

    # Frontend static files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # API proxy
    location /analyze {
        proxy_pass http://phishguard_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 10M;
    }

    location /analyze-eml {
        proxy_pass http://phishguard_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 10M;
    }

    location /verify-app {
        proxy_pass http://phishguard_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://phishguard_api;
        proxy_set_header Host $host;
    }

    location /config {
        proxy_pass http://phishguard_api;
        proxy_set_header Host $host;
    }

    location /supported-apps {
        proxy_pass http://phishguard_api;
        proxy_set_header Host $host;
    }

    location /evaluate {
        proxy_pass http://phishguard_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /evaluation-results {
        proxy_pass http://phishguard_api;
        proxy_set_header Host $host;
    }

    location /upload-dataset {
        proxy_pass http://phishguard_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 50M;
    }

    location /dataset-stats {
        proxy_pass http://phishguard_api;
        proxy_set_header Host $host;
    }

    location /dataset {
        proxy_pass http://phishguard_api;
        proxy_set_header Host $host;
    }

    # Block access to hidden files
    location ~ /\. {
        deny all;
    }
}
